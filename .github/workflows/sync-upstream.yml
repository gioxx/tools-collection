name: Sync upstream

# Fork-only: merge amargiovanni/tools-collection main into this fork's main every night.
# The push triggers Cloudflare Workers Builds, which deploys tools.gioxx.org.
# UPSTREAM_SYNC_TOKEN: fine-grained PAT on this repo with Contents and Workflows read/write
# (GITHUB_TOKEN cannot merge upstream changes to .github/workflows).
# A conflict makes the job fail (HTTP 409): resolve it locally and push.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    if: github.repository == 'gioxx/tools-collection'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main --jq '"\(.merge_type): \(.message)"'
