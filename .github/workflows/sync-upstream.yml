name: Sync upstream

# Fork-only: merge amargiovanni/tools-collection main into this fork's main every night.
# The push triggers Cloudflare Workers Builds, which deploys tools.gioxx.org.
# Uses GITHUB_TOKEN, which can never update .github/workflows: when upstream changes a workflow
# (or on a conflict) the job fails; use "Sync fork" on GitHub, or merge locally and push.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    if: github.repository == 'gioxx/tools-collection'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main --jq '"\(.merge_type): \(.message)"'

  keepalive:
    name: Keep workflow alive
    needs:
      - sync
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow alive
        uses: liskin/gh-workflow-keepalive@v1
